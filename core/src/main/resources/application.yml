spring:
  application:
    name: lecturer-assistant-core
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lecturer_assistant}
    username: ${DB_USERNAME:lecturer}
    password: ${DB_PASSWORD:lecturer_dev_password}
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_SIZE:100MB}
      max-request-size: ${MAX_UPLOAD_SIZE:100MB}
  flyway:
    create-schemas: true
    default-schema: shared
    schemas:
      - shared
      - iam
      - org
      - content
      - live
      - qa
      - feedback
      - interaction
      - channel
      - analytics

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

app:
  version: ${APP_VERSION:0.0.1-SNAPSHOT}
  security:
    jwt-secret: ${JWT_SECRET:phase-1-local-development-secret-change-me}
    require-strong-secret: ${REQUIRE_STRONG_JWT_SECRET:false}
    access-token-minutes: ${ACCESS_TOKEN_MINUTES:15}
    refresh-token-days: ${REFRESH_TOKEN_DAYS:30}
    refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:true}
  content:
    blob-root: ${BLOB_ROOT:./data/blobs}
    max-upload-bytes: ${MAX_UPLOAD_BYTES:104857600}
    slide-image-url-secret: ${SLIDE_IMAGE_URL_SECRET:${JWT_SECRET:phase-1-local-development-secret-change-me}}
    slide-image-url-ttl: ${SLIDE_IMAGE_URL_TTL:PT1H}
    converter-connect-timeout: ${CONVERTER_CONNECT_TIMEOUT:PT5S}
    converter-read-timeout: ${CONVERTER_READ_TIMEOUT:PT20M}
    import-core-pool-size: ${CONTENT_IMPORT_CORE_POOL_SIZE:1}
    import-max-pool-size: ${CONTENT_IMPORT_MAX_POOL_SIZE:2}
    import-queue-capacity: ${CONTENT_IMPORT_QUEUE_CAPACITY:8}
  max:
    bot-token: ${MAX_BOT_TOKEN:}
    init-data-max-age: ${MAX_INIT_DATA_MAX_AGE:PT1H}
  channel:
    internal-api-key: ${CHANNEL_INTERNAL_API_KEY:phase-4-local-channel-key}
    delivery-worker-delay-ms: ${CHANNEL_DELIVERY_WORKER_DELAY_MS:5000}
    telegram-bot: ${TELEGRAM_BOT:}
    vk-bot: ${VK_BOT:}
