spring:
  application:
    name: lecturer-assistant-core
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lecturer_assistant}
    username: ${DB_USERNAME:lecturer}
    password: ${DB_PASSWORD:lecturer_dev_password}
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_SIZE:100MB}
      max-request-size: ${MAX_UPLOAD_SIZE:100MB}
  flyway:
    create-schemas: true
    default-schema: shared
    schemas:
      - shared
      - iam
      - org
      - content
      - live
      - qa
      - feedback
      - interaction
      - channel
      - analytics

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: ${SERVER_PORT:8080}

app:
  version: ${APP_VERSION:0.0.1-SNAPSHOT}
  security:
    jwt-secret: ${JWT_SECRET:phase-1-local-development-secret-change-me}
    require-strong-secret: ${REQUIRE_STRONG_JWT_SECRET:false}
    access-token-minutes: ${ACCESS_TOKEN_MINUTES:15}
    refresh-token-days: ${REFRESH_TOKEN_DAYS:30}
    refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:true}
  content:
    blob-root: ${BLOB_ROOT:./data/blobs}
    max-upload-bytes: ${MAX_UPLOAD_BYTES:104857600}
