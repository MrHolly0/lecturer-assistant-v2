spring:
  application:
    name: lecturer-assistant-core
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lecturer_assistant}
    username: ${DB_USERNAME:lecturer}
    password: ${DB_PASSWORD:lecturer_dev_password}
  flyway:
    create-schemas: true
    default-schema: shared
    schemas:
      - shared
      - iam
      - org
      - content
      - live
      - qa
      - feedback
      - interaction
      - channel
      - analytics

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: ${SERVER_PORT:8080}

app:
  version: ${APP_VERSION:0.0.1-SNAPSHOT}

