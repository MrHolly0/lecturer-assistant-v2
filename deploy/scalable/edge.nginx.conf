map $http_upgrade $connection_upgrade { default upgrade; '' close; }
upstream application {
    zone application 64k;
    least_conn;
    server core-a:8080 resolve max_fails=1 fail_timeout=5s;
    server core-b:8080 resolve max_fails=1 fail_timeout=5s;
    keepalive 32;
}
upstream realtime {
    zone realtime 64k;
    least_conn;
    server realtime-a:8091 resolve max_conns=6000 max_fails=1 fail_timeout=5s;
    server realtime-b:8091 resolve max_conns=6000 max_fails=1 fail_timeout=5s;
    server realtime-c:8091 resolve max_conns=6000 max_fails=1 fail_timeout=5s;
}
upstream media { zone media 64k; server media-control:8093 resolve; }
upstream static_web { zone static_web 64k; server web:8088 resolve; keepalive 16; }
upstream max_channel { zone max_channel 64k; server max-adapter:8090 resolve; }
server {
    listen 8088;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; frame-ancestors 'self' https://web.max.ru https://max.ru https://*.max.ru; script-src 'self' https://st.max.ru; object-src 'none'; base-uri 'self'" always;
    location /__lecturer_blob/ {
        internal; alias /data/blobs/; sendfile on;
        add_header Cache-Control "private, no-cache" always;
    }
    location = /edge-health { return 200; }
    location ~ ^/(internal|actuator|twirp|metrics)(/|$) { return 404; }
    location ~ ^/api/v1/student/sessions/[^/]+/events/public$ {
        limit_req zone=public_open burst=20 nodelay;
        proxy_pass http://realtime;
        proxy_buffering off;
        proxy_read_timeout 45s;
        add_header Cache-Control "no-cache, no-transform" always;
    }
    location ~ ^/api/v1/student/sessions/[^/]+/events$ {
        proxy_pass http://realtime;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 45s;
        # Admission 503 is per-request backpressure, not an unhealthy gateway.
        proxy_next_upstream error timeout http_502;
        proxy_next_upstream_tries 3;
        add_header Cache-Control "no-cache, no-transform" always;
    }
    location /ws/ {
        limit_req zone=websocket_open burst=200 nodelay;
        proxy_pass http://realtime;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $lecturer_client_ip;
        proxy_set_header X-Lecturer-Client-IP $lecturer_client_ip;
        proxy_set_header X-Lecturer-Proxy-Key $lecturer_proxy_key;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
    location /rtc {
        proxy_pass http://media;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $lecturer_client_ip;
        proxy_set_header X-Lecturer-Client-IP $lecturer_client_ip;
        proxy_set_header X-Lecturer-Proxy-Key $lecturer_proxy_key;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
    location ~ ^/api/v1/auth/(login|register)$ {
        limit_req zone=password_open burst=100 nodelay;
        limit_req zone=password_total burst=200 nodelay;
        proxy_pass http://application;
    }
    location ~ ^/api/v1/courses/[^/]+/(decks|lectures/[^/]+/attachments)$ {
        client_max_body_size 101m;
        limit_conn uploads_total 4;
        proxy_request_buffering off;
        proxy_pass http://application;
        proxy_read_timeout 360s;
    }
    location ~ ^/api/v1/courses/[^/]+/sessions/[^/]+/annotations$ {
        client_max_body_size 4m;
        proxy_pass http://application;
    }
    location ~ ^/api/v1/courses/[^/]+/sessions/[^/]+/screen-share/[^/]+/(frame|video/[^/]+/(init|segments/[^/]+))$ {
        client_max_body_size 2m;
        proxy_request_buffering off;
        proxy_pass http://application;
    }
    location /api/ {
        proxy_pass http://application;
        # Never retry a non-idempotent command after it reached its upstream.
        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 2;
    }
    location ~ ^/api/v1/courses/[^/]+/decks/[^/]+/slides/[^/]+/image$ {
        proxy_pass http://application;
        proxy_buffering off;
    }
    location = /health { proxy_pass http://application/actuator/health; }
    location /webhook/ {
        client_max_body_size 64k; proxy_pass http://max_channel; }
    location / { proxy_pass http://static_web; }
}
