map $http_upgrade $connection_upgrade { default upgrade; '' close; }
upstream application {
    zone application 64k;
    least_conn;
    server core-a:8080 resolve max_fails=1 fail_timeout=5s;
    server core-b:8080 resolve max_fails=1 fail_timeout=5s;
    keepalive 32;
}
upstream realtime {
    zone realtime 64k;
    least_conn;
    server realtime-a:8091 resolve max_conns=6000 max_fails=1 fail_timeout=5s;
    server realtime-b:8091 resolve max_conns=6000 max_fails=1 fail_timeout=5s;
    server realtime-c:8091 resolve max_conns=6000 max_fails=1 fail_timeout=5s;
}
upstream media { zone media 64k; server media-control:8093 resolve; }
upstream static_web { zone static_web 64k; server web:8088 resolve; keepalive 16; }
upstream max_channel { zone max_channel 64k; server max-adapter:8090 resolve; }
server {
    listen 8088;
    location = /edge-health { return 200; }
    location ~ ^/(internal|actuator|twirp|metrics)(/|$) { return 404; }
    location ~ ^/api/v1/student/sessions/[^/]+/events(/public)?$ {
        proxy_pass http://realtime;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 45s;
        # Admission 503 is per-request backpressure, not an unhealthy gateway.
        proxy_next_upstream error timeout http_502;
        proxy_next_upstream_tries 3;
        add_header Cache-Control "no-cache, no-transform" always;
    }
    location /ws/ {
        proxy_pass http://realtime;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
    location /rtc {
        proxy_pass http://media;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
    location /api/ {
        proxy_pass http://application;
        # Never retry a non-idempotent command after it reached its upstream.
        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 2;
    }
    location ~ ^/api/v1/courses/[^/]+/decks/[^/]+/slides/[^/]+/image$ {
        proxy_pass http://application;
        proxy_buffering off;
    }
    location = /health { proxy_pass http://application/actuator/health; }
    location /webhook/ { proxy_pass http://max_channel; }
    location / { proxy_pass http://static_web; }
}
