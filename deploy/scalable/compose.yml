name: lecturer-scale-lab

# A single-host functional/failure lab, not a multi-host HA installation.
# No watchdog, tunnel or automatic boot registration. All restart policies are manual.
x-logging: &logs
  driver: local
  options: {max-size: "10m", max-file: "3"}

x-node: &node
  image: lecturer-assistant/services:scale-local
  build: {context: ../.., dockerfile: services/Dockerfile}
  restart: "no"
  init: true
  cpus: 1.0
  logging: *logs
  mem_limit: 384m
  pids_limit: 128
  environment: &node-env
    CORE_URL: http://authority:80
    NODE_OPTIONS: --max-old-space-size=256
    AMQP_URL: amqp://lecturer:${RABBITMQ_PASSWORD:?run init-local.py}@rabbit-a:5672?heartbeat=10,amqp://lecturer:${RABBITMQ_PASSWORD}@rabbit-b:5672?heartbeat=10,amqp://lecturer:${RABBITMQ_PASSWORD}@rabbit-c:5672?heartbeat=10
  depends_on: {authority: {condition: service_started}}
  healthcheck: &node-health
    test: [CMD, node, -e, "fetch('http://127.0.0.1:'+(process.env.PORT||8091)+'/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
    interval: 5s
    timeout: 3s
    start_period: 30s
    retries: 6

x-core: &core
  image: lecturer-assistant/core:scale-local
  build: {context: ../.., dockerfile: core/Dockerfile}
  restart: "no"
  cpus: 2.0
  logging: *logs
  mem_limit: 1g
  pids_limit: 256
  environment: &core-env
    JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=60 -XX:ActiveProcessorCount=2 -Xss512k -XX:+ExitOnOutOfMemoryError
    DB_URL: jdbc:postgresql://postgres:5432/lecturer
    DB_USERNAME: lecturer
    DB_PASSWORD: ${POSTGRES_PASSWORD:?run init-local.py}
    DB_POOL_MAX_SIZE: "12"
    PERMISSION_DB_POOL_SIZE: "4"
    DB_POOL_MIN_IDLE: "1"
    JWT_SECRET: ${JWT_SECRET:?run init-local.py}
    ADMIN_SETUP_TOKEN: ${ADMIN_SETUP_TOKEN:?run init-local.py}
    SLIDE_IMAGE_URL_SECRET: ${SLIDE_IMAGE_URL_SECRET:?run init-local.py}
    CHANNEL_INTERNAL_API_KEY: ${CHANNEL_INTERNAL_API_KEY:?run init-local.py}
    MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:-}
    SERVICE_EVENTS_KEY: ${SERVICE_EVENTS_KEY:?run init-local.py}
    SERVICE_REALTIME_KEY: ${SERVICE_REALTIME_KEY:?run init-local.py}
    SERVICE_ANALYTICS_KEY: ${SERVICE_ANALYTICS_KEY:?run init-local.py}
    SERVICE_MEDIA_KEY: ${SERVICE_MEDIA_KEY:?run init-local.py}
    INTEGRATION_ENABLED: "true"
    LEGACY_LIVE_TRANSPORTS_ENABLED: "false"
    CONTENT_WORKER_ENABLED: "false"
    ANALYTICS_SERVICE_URL: http://analytics:8092
    MEDIA_PROVIDER: sfu
    MEDIA_SERVICE_URL: http://media-control:8093
    APP_CORS_ALLOWED_ORIGINS: ${PUBLIC_URL:-http://localhost:18089}
    REFRESH_COOKIE_SECURE: "false"
    REQUIRE_STRONG_JWT_SECRET: "true"
    APP_CONTENT_CONVERTER_URL: http://converter:8000
    BLOB_ROOT: /data/blobs
  volumes: [blobs:/data/blobs]
  healthcheck:
    test: [CMD, curl, -fsS, http://127.0.0.1:8080/actuator/health]
    interval: 5s
    timeout: 3s
    start_period: 60s
    retries: 12
  depends_on:
    postgres: {condition: service_healthy}

x-realtime: &realtime
  <<: *node
  mem_limit: 768m
  command: [node, realtime/index.mjs]
  environment:
    <<: *node-env
    PORT: "8091"
    SERVICE_REALTIME_KEY: ${SERVICE_REALTIME_KEY:?run init-local.py}
    CORS_ALLOWED_ORIGINS: ${PUBLIC_URL:-http://localhost:18089}
    MAX_CONNECTIONS: "6000"
    NODE_OPTIONS: --max-old-space-size=384

x-rabbit: &rabbit
  image: rabbitmq:4.1-alpine
  restart: "no"
  cpus: 1.0
  logging: *logs
  mem_limit: 512m
  pids_limit: 256
  environment:
    RABBITMQ_DEFAULT_USER: lecturer
    RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?run init-local.py}
    RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:?run init-local.py}
    RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: +S 2:2
  healthcheck:
    test: [CMD, rabbitmq-diagnostics, -q, check_running]
    interval: 10s
    timeout: 10s
    start_period: 30s
    retries: 12

services:
  postgres:
    image: postgres:16-alpine
    restart: "no"
    logging: *logs
    cpus: 2.0
    pids_limit: 128
    mem_limit: 768m
    environment:
      POSTGRES_DB: lecturer
      POSTGRES_USER: lecturer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run init-local.py}
      CONTENT_DB_PASSWORD: ${CONTENT_DB_PASSWORD:?run init-local.py}
    command: [postgres, -c, max_connections=100, -c, shared_buffers=128MB]
    volumes: [app-db:/var/lib/postgresql/data, ./postgres-init.sh:/docker-entrypoint-initdb.d/10-worker.sh:ro]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U lecturer -d lecturer"]
      interval: 5s
      timeout: 3s
      retries: 20
  analytics-db:
    image: postgres:16-alpine
    restart: "no"
    logging: *logs
    cpus: 1.0
    pids_limit: 128
    mem_limit: 384m
    environment:
      POSTGRES_DB: analytics
      POSTGRES_USER: analytics
      POSTGRES_PASSWORD: ${ANALYTICS_PASSWORD:?run init-local.py}
    volumes: [analytics-db:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U analytics -d analytics"]
      interval: 5s
      timeout: 3s
      retries: 20
  rabbit-a:
    <<: *rabbit
    hostname: rabbit-a
    volumes: [rabbit-a:/var/lib/rabbitmq, ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro]
  rabbit-b:
    <<: *rabbit
    hostname: rabbit-b
    volumes: [rabbit-b:/var/lib/rabbitmq, ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro]
    # Existing cluster members must start together after a full shutdown.
    depends_on: {rabbit-a: {condition: service_started}}
  rabbit-c:
    <<: *rabbit
    hostname: rabbit-c
    volumes: [rabbit-c:/var/lib/rabbitmq, ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro]
    depends_on: {rabbit-a: {condition: service_started}}
  redis:
    image: redis:7.4-alpine
    restart: "no"
    logging: *logs
    cpus: 0.5
    pids_limit: 64
    mem_limit: 256m
    command: [redis-server, --requirepass, "${REDIS_PASSWORD:?run init-local.py}", --maxmemory, 128mb, --maxmemory-policy, noeviction]
  core-a: {<<: *core}
  core-b: {<<: *core}
  converter:
    build: {context: ../.., dockerfile: deploy/converter/Dockerfile}
    restart: "no"
    logging: *logs
    cpus: 1.0
    pids_limit: 128
    init: true
    mem_limit: 1536m
    environment: {CONVERTER_MAX_CONVERSIONS: "2"}
    volumes: [blobs:/data/blobs]
  content-worker:
    <<: *core
    mem_limit: 768m
    environment:
      # Only content components are instantiated. The worker cannot query IAM/live tables.
      APP_ROLE: content-worker
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=60 -XX:ActiveProcessorCount=2 -Xss512k
      DB_URL: jdbc:postgresql://postgres:5432/lecturer
      DB_USERNAME: content_worker
      DB_PASSWORD: ${CONTENT_DB_PASSWORD:?run init-local.py}
      DB_POOL_MAX_SIZE: "4"
      DB_POOL_MIN_IDLE: "0"
      SPRING_FLYWAY_ENABLED: "false"
      CONTENT_WORKER_ENABLED: "true"
      APP_CONTENT_CONVERTER_URL: http://converter:8000
      BLOB_ROOT: /data/blobs
    depends_on:
      core-a: {condition: service_healthy}
      converter: {condition: service_healthy}
  realtime-a: {<<: *realtime}
  realtime-b: {<<: *realtime}
  realtime-c: {<<: *realtime}
  event-publisher:
    <<: *node
    command: [node, event-publisher/index.mjs]
    environment:
      <<: *node-env
      PORT: "8094"
      SERVICE_EVENTS_KEY: ${SERVICE_EVENTS_KEY:?run init-local.py}
  analytics:
    <<: *node
    command: [node, analytics/index.mjs]
    environment:
      <<: *node-env
      PORT: "8092"
      ANALYTICS_DATABASE_URL: postgres://analytics:${ANALYTICS_PASSWORD:?run init-local.py}@analytics-db:5432/analytics
      SERVICE_ANALYTICS_KEY: ${SERVICE_ANALYTICS_KEY:?run init-local.py}
    depends_on: {analytics-db: {condition: service_healthy}}
  sfu:
    image: lecturer-assistant/sfu:scale-local
    build: {context: ../.., dockerfile: services/Dockerfile.sfu}
    restart: "no"
    logging: *logs
    cpus: 2.0
    pids_limit: 128
    init: true
    # Local bind file is private (0600) on the host. Kubernetes uses a projected Secret instead.
    user: "0:0"
    mem_limit: 768m
    environment:
      CORE_URL: http://authority:80
      SERVICE_MEDIA_KEY: ${SERVICE_MEDIA_KEY:?run init-local.py}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?run init-local.py}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?run init-local.py}
    volumes: [./livekit.local.yaml:/etc/livekit.yaml:ro]
    ports: ["7881:7881", "7882:7882/udp", "3478:3478/udp"]
  media-control:
    <<: *node
    command: [node, media-control/index.mjs]
    environment:
      <<: *node-env
      PORT: "8093"
      SERVICE_MEDIA_KEY: ${SERVICE_MEDIA_KEY:?run init-local.py}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?run init-local.py}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?run init-local.py}
      LIVEKIT_INTERNAL_URL: http://sfu:7880
      LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL:-ws://localhost:18089}
  max-adapter:
    profiles: [channels]
    build: {context: ../.., dockerfile: adapters/max/Dockerfile}
    restart: "no"
    logging: *logs
    init: true
    cpus: 0.5
    pids_limit: 64
    mem_limit: 256m
    environment:
      CORE_URL: http://authority:80
      CHANNEL_INTERNAL_API_KEY: ${CHANNEL_INTERNAL_API_KEY:?run init-local.py}
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:-}
      MAX_WEBAPP_URL: ${MAX_WEBAPP_URL:-}
      MAX_WEBHOOK_URL: ${MAX_WEBHOOK_URL:-}
      MAX_WEBHOOK_SECRET: ${MAX_WEBHOOK_SECRET:-}
      MAX_REGISTER_WEBHOOK_ON_START: ${MAX_REGISTER_WEBHOOK_ON_START:-false}
      MAX_RATE_LIMIT_RPS: "15"
    depends_on: {authority: {condition: service_started}}
  web:
    build: {context: ../.., dockerfile: web/Dockerfile}
    restart: "no"
    logging: *logs
    cpus: 0.5
    pids_limit: 64
    mem_limit: 128m
    user: "101:101"
    volumes: [./nginx.conf:/etc/nginx/conf.d/default.conf:ro, ./nginx-main.conf:/etc/nginx/nginx.conf:ro]
  edge:
    image: nginx:1.27-alpine
    restart: "no"
    logging: *logs
    cpus: 2.0
    pids_limit: 64
    mem_limit: 512m
    user: "101:101"
    ulimits: {nofile: {soft: 65536, hard: 65536}}
    ports: ["${WEB_BIND:-127.0.0.1}:${WEB_PORT:-18089}:8088"]
    volumes: [./edge.nginx.conf:/etc/nginx/conf.d/default.conf:ro, ./nginx-main.conf:/etc/nginx/nginx.conf:ro]
    networks: {default: {aliases: [capacity-caddy]}}
    depends_on: [core-a, core-b, web, realtime-a, realtime-b, realtime-c, analytics, media-control]
  authority:
    # A dedicated internal route is necessary: public edge never exposes service RPCs.
    image: caddy:2.8-alpine
    restart: "no"
    logging: *logs
    cpus: 0.5
    pids_limit: 64
    mem_limit: 64m
    volumes: [./authority.Caddyfile:/etc/caddy/Caddyfile:ro]
    depends_on:
      core-a: {condition: service_healthy}
      core-b: {condition: service_healthy}

volumes:
  app-db:
  analytics-db:
  blobs:
  rabbit-a:
  rabbit-b:
  rabbit-c:
