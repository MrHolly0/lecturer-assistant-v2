# Requires CloudNativePG 1.28 and RabbitMQ Cluster Operator. Apply in the institution's namespace.
# These resources need three independent schedulable hosts and a suitable storage class.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: app-db
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:16
  enableSuperuserAccess: false
  bootstrap:
    initdb:
      database: lecturer
      owner: lecturer
  managed:
    roles:
      - name: content_worker
        ensure: present
        login: true
        passwordSecret:
          name: content-worker-db
  postgresql:
    synchronous:
      method: any
      number: 1
      dataDurability: required
      failoverQuorum: true
    parameters:
      max_connections: "180"
      shared_buffers: 1GB
      work_mem: 4MB
      statement_timeout: 30s
      idle_in_transaction_session_timeout: 60s
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname
  storage:
    size: 100Gi
  resources:
    requests: {cpu: "2", memory: 4Gi}
    limits: {cpu: "4", memory: 8Gi}
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: analytics-db
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:16
  enableSuperuserAccess: false
  bootstrap:
    initdb: {database: analytics, owner: analytics}
  postgresql:
    synchronous:
      method: any
      number: 1
      dataDurability: required
      failoverQuorum: true
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname
  storage: {size: 50Gi}
  resources:
    requests: {cpu: "1", memory: 1Gi}
    limits: {cpu: "2", memory: 2Gi}
---
apiVersion: rabbitmq.com/v1beta1
kind: RabbitmqCluster
metadata:
  name: events
spec:
  replicas: 3
  image: rabbitmq:4.1-alpine
  persistence: {storage: 20Gi}
  resources:
    requests: {cpu: "1", memory: 512Mi}
    limits: {cpu: "2", memory: 1Gi}
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels: {app.kubernetes.io/name: events}
          topologyKey: kubernetes.io/hostname
  rabbitmq:
    additionalConfig: |
      cluster_partition_handling = pause_minority
      queue_leader_locator = balanced
      quorum_queue.continuous_membership_reconciliation.enabled = true
      quorum_queue.continuous_membership_reconciliation.target_group_size = 3
      quorum_queue.continuous_membership_reconciliation.interval = 10000
      disk_free_limit.absolute = 2GB
      vm_memory_high_watermark.relative = 0.6
