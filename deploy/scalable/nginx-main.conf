worker_processes 2;
worker_rlimit_nofile 65536;
pid /tmp/nginx.pid;
# Routine proxy errors include query-string bearer tokens in nginx diagnostics.
error_log /dev/stderr crit;
events { worker_connections 16384; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 64k;
    proxy_request_buffering off;
    limit_req_zone $binary_remote_addr zone=public_open:2m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=websocket_open:2m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=password_open:2m rate=10r/s;
    map $request_method $upload_slot { default ""; POST "installation"; }
    limit_conn_zone $upload_slot zone=uploads_total:1m;
    limit_req_status 429;
    limit_conn_status 429;
    client_header_timeout 10s;
    client_body_timeout 30s;
    keepalive_timeout 30s;
    send_timeout 15s;
    server_tokens off;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 2s;
    proxy_read_timeout 30s;
    proxy_send_timeout 15s;
    proxy_max_temp_file_size 0;
    resolver 127.0.0.11 valid=5s ipv6=off;
    include /etc/nginx/conf.d/*.conf;
}
