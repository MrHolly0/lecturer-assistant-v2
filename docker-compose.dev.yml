services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lecturer_assistant}
      POSTGRES_USER: ${POSTGRES_USER:-lecturer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lecturer_dev_password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data

  core-dev:
    profiles: ["hot-reload"]
    image: maven:3.9.9-eclipse-temurin-21
    working_dir: /workspace
    command: mvn -pl core -am spring-boot:run
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/lecturer_assistant
      DB_USERNAME: ${DB_USERNAME:-lecturer}
      DB_PASSWORD: ${DB_PASSWORD:-lecturer_dev_password}
    ports:
      - "${CORE_PORT:-8080}:8080"
    volumes:
      - .:/workspace
      - maven-cache:/root/.m2
    depends_on:
      - postgres

  web-dev:
    profiles: ["hot-reload"]
    image: node:22-alpine
    working_dir: /workspace/web
    command: sh -c "npm install && npm run dev"
    ports:
      - "${WEB_PORT:-3000}:5173"
    volumes:
      - .:/workspace
      - web-node-modules:/workspace/web/node_modules
    depends_on:
      - core-dev

volumes:
  postgres-dev-data:
  maven-cache:
  web-node-modules:

