# Стенд: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Все секреты обязательны и берутся из .env на сервере (deploy/stand/init-env.sh).
# Наружу открыты только 80 и 443 (Caddy); остальные сервисы доступны внутри сети
# compose или на 127.0.0.1 сервера.

services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}

  core:
    environment:
      DB_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      JWT_SECRET: ${JWT_SECRET:?задайте JWT_SECRET в .env}
      SLIDE_IMAGE_URL_SECRET: ${SLIDE_IMAGE_URL_SECRET:?задайте SLIDE_IMAGE_URL_SECRET в .env}
      CHANNEL_INTERNAL_API_KEY: ${CHANNEL_INTERNAL_API_KEY:?задайте CHANNEL_INTERNAL_API_KEY в .env}
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:?задайте MAX_BOT_TOKEN в .env}
      REQUIRE_STRONG_JWT_SECRET: "true"
      APP_CORS_ALLOWED_ORIGINS: https://${SITE_DOMAIN:?задайте SITE_DOMAIN в .env}
      REFRESH_COOKIE_SECURE: "true"

  web:
    ports: !reset []

  max-adapter:
    environment:
      CHANNEL_INTERNAL_API_KEY: ${CHANNEL_INTERNAL_API_KEY:?задайте CHANNEL_INTERNAL_API_KEY в .env}
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:?задайте MAX_BOT_TOKEN в .env}
      MAX_WEBAPP_URL: https://${SITE_DOMAIN:?задайте SITE_DOMAIN в .env}/
      MAX_WEBHOOK_URL: https://${SITE_DOMAIN}${MAX_WEBHOOK_PATH:?задайте MAX_WEBHOOK_PATH в .env}
      MAX_WEBHOOK_PATH: ${MAX_WEBHOOK_PATH}
      MAX_WEBHOOK_SECRET: ${MAX_WEBHOOK_SECRET:?задайте MAX_WEBHOOK_SECRET в .env}

  telegram-adapter:
    environment:
      CHANNEL_INTERNAL_API_KEY: ${CHANNEL_INTERNAL_API_KEY:?задайте CHANNEL_INTERNAL_API_KEY в .env}

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    mem_limit: ${CADDY_MEMORY_LIMIT:-512m}
    cpus: ${CADDY_CPU_LIMIT:-1.0}
    pids_limit: 128
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      GOMEMLIMIT: ${CADDY_GO_MEMORY_LIMIT:-320MiB}
      GODEBUG: disablethp=1
      GOMAXPROCS: ${CADDY_GO_MAX_PROCS:-1}
      SITE_ADDRESS: ${SITE_DOMAIN:?задайте SITE_DOMAIN в .env}
      ACME_EMAIL: ${ACME_EMAIL:?задайте ACME_EMAIL в .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy

  # Ежедневная согласованная пара DB+blob в отдельном host mount.
  db-backup:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: ${BACKUP_MEMORY_LIMIT:-256m}
    cpus: ${BACKUP_CPU_LIMIT:-0.5}
    pids_limit: 64
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-lecturer_assistant}
      PGUSER: ${POSTGRES_USER:-lecturer}
      PGPASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_LOCK_WAIT_SECONDS: ${BACKUP_LOCK_WAIT_SECONDS:-1800}
      BACKUP_DESTINATION: /backup-destination
      BACKUP_SOURCE_PROJECT: ${BACKUP_SOURCE_PROJECT:-lecturer-assistant}
      APP_VERSION: ${APP_VERSION:-0.0.1-SNAPSHOT}
      APP_GIT_SHA: ${APP_GIT_SHA:-unknown}
      BLOB_SOURCE: /blob-source
    volumes:
      - ${BACKUP_DESTINATION:?задайте BACKUP_DESTINATION на независимое хранилище}:/backup-destination
      - blob-data:/blob-source:ro
      - ./deploy/stand/backup/create-pair.sh:/usr/local/bin/create-pair.sh:ro
      - ./deploy/stand/backup/verify-pair.sh:/usr/local/bin/verify-pair.sh:ro
      - ./deploy/stand/backup/check-latest-pair.sh:/usr/local/bin/check-latest-pair.sh:ro
      - ./deploy/stand/backup/restore-pair.sh:/usr/local/bin/restore-pair.sh:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sleep 300
        while true; do
          if /usr/local/bin/create-pair.sh; then
            echo "backup pair ok"
            sleep 86400
          else
            echo "backup pair FAILED"
            sleep 900
          fi
        done
    healthcheck:
      test: ["CMD-SHELL", "/usr/local/bin/check-latest-pair.sh"]
      interval: 15m
      timeout: 2m
      retries: 2
      start_period: 10m
    depends_on:
      core:
        condition: service_healthy
      postgres:
        condition: service_healthy

volumes:
  caddy-data:
  caddy-config:
