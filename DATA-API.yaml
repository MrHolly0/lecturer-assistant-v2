# API checks for the MAX hackathon submission.
# The track brief lists required content but supplies no exact YAML schema.
# Key names are provisional until the organizers publish a template.
schemaVersion: "1.0"
solution:
  name: lecturer-assistant-v2
  teamName: "ХАМЛ"
  teamId: null # Numeric application ID is unknown; 428 in the bot name is unconfirmed.
  track: "Образовательные решения"
api:
  baseUrl: https://lecturer-assistant.ru.tuna.am/api/v1
  openapi: openapi/lecturer-assistant-v2.yaml
  contentType: application/json
  authentication:
    type: bearer
    tokenFrom: lecturer-login.response.accessToken
testData:
  source: "docker compose run --rm seed"
  lecturerEmail: lecturer@lecturer-assistant.test
  lecturerPassword: "${SEED_PASSWORD_LECTURER}"
  description: The test password is supplied privately and never stored in Git.
checks:
  - id: system-info
    name: Public service status
    method: GET
    path: /system/info
    role: anonymous
    request: {}
    expected:
      statusCodes: [200]
      contentType: application/json
      requiredFields: [name, version, status]
      fieldValues:
        name: lecturer-assistant-v2

  - id: lecturer-login
    name: Seed lecturer authentication
    method: POST
    path: /auth/login
    role: lecturer
    request:
      headers:
        Content-Type: application/json
      body:
        email: lecturer@lecturer-assistant.test
        password: "${SEED_PASSWORD_LECTURER}"
    expected:
      statusCodes: [200]
      contentType: application/json
      requiredFields: [accessToken, user]
      requiredNestedFields:
        user: [id, email, role, status]
      fieldValues:
        user.email: lecturer@lecturer-assistant.test
    extract:
      accessToken: "$.accessToken"

  - id: lecturer-profile
    name: Lecturer profile after login
    method: GET
    path: /auth/me
    role: lecturer
    dependsOn: [lecturer-login]
    request:
      headers:
        Authorization: "Bearer ${lecturer-login.accessToken}"
    expected:
      statusCodes: [200]
      contentType: application/json
      requiredFields: [id, displayName, email, role, status]
      fieldValues:
        email: lecturer@lecturer-assistant.test

  - id: lecturer-courses
    name: Lecturer's seeded courses
    method: GET
    path: /courses
    role: lecturer
    dependsOn: [lecturer-login]
    request:
      headers:
        Authorization: "Bearer ${lecturer-login.accessToken}"
    expected:
      statusCodes: [200]
      contentType: application/json
      responseType: array
      minItems: 1
      itemRequiredFields: [id, title, archived]
    extract:
      courseId: "$[0].id"

  - id: course-details
    name: Course with members and groups
    method: GET
    path: "/courses/${lecturer-courses.courseId}"
    role: lecturer
    dependsOn: [lecturer-login, lecturer-courses]
    request:
      headers:
        Authorization: "Bearer ${lecturer-login.accessToken}"
    expected:
      statusCodes: [200]
      contentType: application/json
      requiredFields: [id, title, ownerPersonId, archived, members, groups]

  - id: course-groups
    name: Course study groups
    method: GET
    path: "/courses/${lecturer-courses.courseId}/groups"
    role: lecturer
    dependsOn: [lecturer-login, lecturer-courses]
    request:
      headers:
        Authorization: "Bearer ${lecturer-login.accessToken}"
    expected:
      statusCodes: [200]
      contentType: application/json
      responseType: array

  - id: group-analytics
    name: Current group analytics
    method: GET
    path: "/courses/${lecturer-courses.courseId}/analytics/groups"
    role: lecturer
    dependsOn: [lecturer-login, lecturer-courses]
    request:
      headers:
        Authorization: "Bearer ${lecturer-login.accessToken}"
    expected:
      statusCodes: [200]
      contentType: application/json
      requiredFields: [courseId, overall, groups, ungrouped, unidentified]

  - id: student-analytics
    name: Paginated student analytics
    method: GET
    path: "/courses/${lecturer-courses.courseId}/analytics/students"
    role: lecturer
    dependsOn: [lecturer-login, lecturer-courses]
    request:
      headers:
        Authorization: "Bearer ${lecturer-login.accessToken}"
      query:
        limit: 5
        offset: 0
    expected:
      statusCodes: [200]
      contentType: application/json
      requiredFields: [items, limit, offset, total]

notes:
  - All checks are read-only except authentication and leave the seed data intact.
  - The first course returned to the seed lecturer supplies courseId.
  - MAX and live lecture flows are described in docs/hackathon/JURY_WALKTHROUGH.md.
  - Field names of this YAML are provisional because the organizers supplied no template.
