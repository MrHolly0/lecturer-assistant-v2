name: CI

on:
  push:
    branches: ["master", "v2/**", "release/**", "feature/**"]
  workflow_dispatch:
  pull_request:
    branches: ["master"]

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      analytics-db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: analytics_test
          POSTGRES_PASSWORD: isolated_ci_only
          POSTGRES_DB: analytics_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U analytics_test -d analytics_test"
          --health-interval 5s --health-timeout 3s --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify core
        run: mvn -B verify

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Verify web
        working-directory: web
        run: |
          npm ci
          npm run gen:api
          git diff --exit-code -- src/app/api/schema.ts
          npm test
          npm run lint
          npm run format
          npm run build

      - name: Verify MAX adapter
        run: node --test adapters/max/*.test.mjs

      - name: Set up Node 24 LTS for distributed services
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: services/package-lock.json

      - name: Verify distributed services
        working-directory: services
        env:
          SERVICES_TEST_DATABASE_URL: postgres://analytics_test:isolated_ci_only@localhost:5432/analytics_test
        run: |
          npm ci
          npm test

      - name: Verify HA rendering
        run: python3 -m unittest discover -s deploy/scalable/ha -p '*_test.py'

      - name: Validate scalable lab configuration
        run: |
          python3 deploy/scalable/init-local.py
          docker compose --env-file deploy/scalable/.env -f deploy/scalable/compose.yml config --quiet

      - name: Check optional adapter syntax
        run: |
          node --check adapters/telegram/telegram-adapter.mjs
          node --check adapters/echo/echo-adapter.mjs

      - name: Check backup scripts
        run: sh -n deploy/stand/backup/*.sh

      - name: Verify converter admission
        run: python3 -m unittest discover -s deploy/converter -p '*_test.py'

      - name: Validate compose
        run: docker compose config --quiet

      - name: Build core image
        run: docker build -f core/Dockerfile -t lecturer-assistant-core:ci .

      - name: Build web image
        run: docker build -f web/Dockerfile -t lecturer-assistant-web:ci .

      - name: Build services image
        run: docker build -f services/Dockerfile -t lecturer-assistant-services:ci .

      - name: Verify and build SFU image
        run: docker build -f services/Dockerfile.sfu -t lecturer-assistant-sfu:ci .
