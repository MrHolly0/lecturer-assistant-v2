name: CI

on:
  push:
    branches: ["main", "master", "v2/**", "release/**", "feature/**", "fix/**"]
  workflow_dispatch:
  workflow_call:
  pull_request:
    branches: ["main", "master", "release/hackathon-max"]

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      analytics-db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: analytics_test
          POSTGRES_PASSWORD: isolated_ci_only
          POSTGRES_DB: analytics_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U analytics_test -d analytics_test"
          --health-interval 5s --health-timeout 3s --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify core
        run: mvn -B verify

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Verify web
        working-directory: web
        run: |
          npm ci
          npm run gen:api
          git diff --exit-code -- src/app/api/schema.ts
          npm test
          npm run lint
          npm run format
          npm run build
          npm audit --audit-level=high

      - name: Set up Node 24 LTS for distributed services
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: services/package-lock.json

      - name: Verify MAX adapter on Node 24
        run: node --test adapters/max/*.test.mjs

      - name: Verify distributed services
        working-directory: services
        env:
          SERVICES_TEST_DATABASE_URL: postgres://analytics_test:isolated_ci_only@localhost:5432/analytics_test
        run: |
          npm ci
          npm test
          npm audit --omit=dev --audit-level=high

      - name: Verify capacity client socket isolation
        run: node --test e2e/http-client.test.mjs

      - name: Verify HA rendering
        run: python3 -m unittest discover -s deploy/scalable/ha -p '*_test.py'

      - name: Verify installation rendering and scripts
        run: |
          python3 -m unittest discover -s deploy/k8s -p '*_test.py'
          python3 -m unittest discover -s deploy/cloud -p '*_test.py'
          python3 -m unittest discover -s deploy/updates -p '*_test.py'
          python3 -m unittest discover -s deploy/appliance -p '*_test.py'
          python3 -m unittest discover -s deploy/converter -p '*_test.py'
          python3 deploy/appliance/control.py --help
          sh -n deploy/appliance/lecturer.sh
          python3 deploy/updates/installation_operator.py --help
          python3 deploy/updates/publish-catalog.py --help
          sh -n deploy/cloud/lecturer.sh
          sh -n deploy/k8s/lecturer-k8s.sh

      - name: Validate scalable lab configuration
        run: |
          python3 deploy/scalable/init-local.py
          docker compose --env-file deploy/scalable/.env -f deploy/scalable/compose.yml config --quiet

      - name: Verify appliance ingress
        run: python3 e2e/proxy-chain-drill.py --pull --output "$RUNNER_TEMP/proxy-chain-check.json"

      - name: Save appliance ingress result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appliance-ingress-check
          path: ${{ runner.temp }}/proxy-chain-check.*
          if-no-files-found: ignore

      - name: Check optional adapter syntax
        run: |
          node --check adapters/telegram/telegram-adapter.mjs
          node --check adapters/echo/echo-adapter.mjs

      - name: Check backup scripts
        run: sh -n deploy/stand/backup/*.sh

      - name: Validate compose
        env:
          CONVERTER_API_KEY: isolated_ci_converter_key_only
        run: docker compose config --quiet

      - name: Build core image
        run: docker build -f core/Dockerfile -t lecturer-assistant-core:ci .

      - name: Build web image
        run: docker build -f web/Dockerfile -t lecturer-assistant-web:ci .

      - name: Build services image
        run: docker build -f services/Dockerfile -t lecturer-assistant-services:ci .

      - name: Verify single-VM container package
        run: |
          docker build -f deploy/appliance/Dockerfile -t lecturer-appliance-controller:ci .
          APPLIANCE_STATE="$RUNNER_TEMP/appliance-state" APPLIANCE_BACKUPS="$RUNNER_TEMP/appliance-backups" CLUSTER_MEMORY=13312m CLUSTER_CPUS=8 CONTROLLER_IMAGE=lecturer-appliance-controller:ci docker compose -f deploy/appliance/compose.yml config --quiet

      - name: Verify and build SFU image
        run: docker build -f services/Dockerfile.sfu -t lecturer-assistant-sfu:ci .
