name: Projector helper packages

on:
  workflow_dispatch:
  push:
    branches: ["feature/**", "fix/**"]
    paths:
      - "projector-agent/**"
      - ".github/workflows/projector-agent.yml"
  pull_request:
    paths:
      - "projector-agent/**"
      - "core/src/main/java/ru/university/assistant/projection/**"
      - "openapi/lecturer-assistant-v2.yaml"
      - ".github/workflows/projector-agent.yml"

permissions:
  contents: read

concurrency:
  group: projector-packages-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_GENERATE_ASPNET_CERTIFICATE: "false"

jobs:
  policy-and-updater:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet run --project projector-agent/tests/Projector.Checks/Projector.Checks.csproj -c Release
      - run: dotnet build projector-agent/src/Projector.Updater/Projector.Updater.csproj -c Release
      - run: dotnet build projector-agent/src/Projector.Launcher/Projector.Launcher.csproj -c Release
      - run: dotnet run --project projector-agent/src/Projector.Agent/Projector.Agent.csproj -- --self-test
      - run: node --check projector-agent/scripts/provision-release-key.mjs

  windows-package:
    needs: policy-and-updater
    timeout-minutes: 25
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: win-x64
            platform: WINDOWS_X64
            runner: windows-2022
          - runtime: win-arm64
            platform: WINDOWS_ARM64
            runner: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Install pinned Inno Setup compiler on isolated runner
        timeout-minutes: 5
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-7.1.0-x64.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe' -OutFile $installer
          if ((Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant() -ne '0362a383ed217d4c4239b5933866dd96d3eb2102737da92f80f6057a4b40df2f') { throw 'Inno Setup checksum mismatch' }
          $compilerRoot = Join-Path $env:RUNNER_TEMP 'projector-inno'
          $install = Start-Process $installer -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/CURRENTUSER', "/DIR=`"$compilerRoot`"") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw 'Inno Setup installation failed on isolated CI runner' }
          $compiler = Join-Path $compilerRoot 'ISCC.exe'
          if (-not (Test-Path $compiler)) { throw 'ISCC compiler is unavailable' }
          "PROJECTOR_ISCC=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build per-user development installer and update package
        shell: pwsh
        run: ./projector-agent/scripts/build-windows.ps1 -Runtime '${{ matrix.runtime }}' -Version '0.1.1' -InnoCompiler "$env:PROJECTOR_ISCC"
      - name: Build a second version for installer upgrade tests
        shell: pwsh
        run: ./projector-agent/scripts/build-windows.ps1 -Runtime '${{ matrix.runtime }}' -Version '0.2.2' -InnoCompiler "$env:PROJECTOR_ISCC"
      - name: Verify real install, upgrade, downgrade refusal and removal without launching the helper
        shell: pwsh
        run: |
          ./projector-agent/scripts/test-windows-install.ps1 -Installer 'projector-agent/packages/${{ matrix.runtime }}/lecturer-projector-${{ matrix.runtime }}-0.1.1-setup-unsigned.exe' -Version '0.1.1' -Platform '${{ matrix.platform }}' -UpgradeInstaller 'projector-agent/packages/${{ matrix.runtime }}/lecturer-projector-${{ matrix.runtime }}-0.2.2-setup-unsigned.exe' -UpgradeVersion '0.2.2'
      - name: Verify native workspace bridge and capture exclusion API in isolated window
        timeout-minutes: 8
        shell: pwsh
        run: |
          function Invoke-WorkspaceProcess([string]$Executable, [string[]]$Arguments, [int]$TimeoutSeconds) {
            $created = Start-Process -FilePath $Executable -ArgumentList $Arguments -PassThru
            Write-Host "Started $([IO.Path]::GetFileName($Executable)) PID $($created.Id), timeout $TimeoutSeconds seconds"
            try {
              if (-not $created.WaitForExit($TimeoutSeconds * 1000)) {
                $diagnostic = Join-Path $env:PROJECTOR_INSTALL_SMOKE_ROOT ("workspace-process-timeout-$($created.Id).json")
                [ordered]@{ executable = $Executable; processId = $created.Id; timeoutSeconds = $TimeoutSeconds; processTerminated = $false } | ConvertTo-Json | Set-Content -LiteralPath $diagnostic -Encoding utf8NoBOM
                throw "Workspace process timed out (PID $($created.Id)); see $diagnostic. No process was terminated."
              }
              return $created.ExitCode
            }
            finally { $created.Dispose() }
          }
          $fixtureRoot = Join-Path $env:RUNNER_TEMP ('projector-workspace-' + [Guid]::NewGuid().ToString('N'))
          Expand-Archive -LiteralPath 'projector-agent/packages/${{ matrix.runtime }}/lecturer-projector-${{ matrix.runtime }}-0.2.2-update-unsigned.zip' -DestinationPath $fixtureRoot
          $helper = Join-Path $fixtureRoot 'app/Projector.Windows.exe'
          if (-not (Test-Path -LiteralPath $helper)) { throw 'Native helper executable missing from update package' }
          if (-not $env:PROJECTOR_INSTALL_SMOKE_ROOT) { throw 'Installer smoke diagnostics directory missing' }
          $preflight = Join-Path $env:PROJECTOR_INSTALL_SMOKE_ROOT 'workspace-runtime-before.json'
          $probe = Invoke-WorkspaceProcess $helper @('--preflight', "`"$preflight`"") 30
          if ($probe -ne 0) { throw 'Native runtime preflight failed' }
          $runtime = (Get-Content -LiteralPath $preflight -Raw | ConvertFrom-Json).webView2
          $runtimeVersion = $null
          if ($runtime.status -ne 'AVAILABLE' -or -not [Version]::TryParse(($runtime.version -split ' ')[0], [ref]$runtimeVersion) -or $runtimeVersion.Major -lt 132) {
            $bootstrapper = Join-Path $fixtureRoot 'MicrosoftEdgeWebview2Setup.exe'
            Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $bootstrapper
            $signature = Get-AuthenticodeSignature -LiteralPath $bootstrapper
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation(?:,|$)') { throw 'WebView2 bootstrapper is not signed by Microsoft' }
            $installation = Invoke-WorkspaceProcess $bootstrapper @('/silent', '/install') 180
            if ($installation -ne 0) { throw 'Microsoft WebView2 Runtime installation failed on isolated runner' }
            $preflight = Join-Path $env:PROJECTOR_INSTALL_SMOKE_ROOT 'workspace-runtime-after.json'
            $probe = Invoke-WorkspaceProcess $helper @('--preflight', "`"$preflight`"") 30
            if ($probe -ne 0) { throw 'Installed WebView2 Runtime preflight failed' }
            $runtime = (Get-Content -LiteralPath $preflight -Raw | ConvertFrom-Json).webView2
            $runtimeVersion = $null
            if ($runtime.status -ne 'AVAILABLE' -or -not [Version]::TryParse(($runtime.version -split ' ')[0], [ref]$runtimeVersion) -or $runtimeVersion.Major -lt 132) { throw 'WebView2 Runtime 132+ remains unavailable' }
          }
          $report = Join-Path $env:PROJECTOR_INSTALL_SMOKE_ROOT 'workspace-self-test.json'
          $fixture = Invoke-WorkspaceProcess $helper @('--workspace-self-test', "`"$report`"") 120
          if (Test-Path -LiteralPath $report) { Get-Content -LiteralPath $report }
          if ($fixture -ne 0 -or -not (Test-Path -LiteralPath $report)) { throw 'Native workspace fixture failed' }
          $result = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
          if ($result.success -ne $true) { throw 'Native workspace fixture did not confirm success' }
      - name: Save installer smoke diagnostics
        if: always() && env.PROJECTOR_INSTALL_SMOKE_ROOT != ''
        uses: actions/upload-artifact@v4
        with:
          name: projector-${{ matrix.runtime }}-smoke-logs
          retention-days: 1
          if-no-files-found: warn
          path: |
            ${{ env.PROJECTOR_INSTALL_SMOKE_ROOT }}/*.log
            ${{ env.PROJECTOR_INSTALL_SMOKE_ROOT }}/*.json
      - uses: actions/upload-artifact@v4
        with:
          name: projector-${{ matrix.runtime }}-development
          retention-days: 1
          if-no-files-found: error
          path: |
            projector-agent/packages/${{ matrix.runtime }}/*-0.2.2-setup-unsigned.exe
            projector-agent/packages/${{ matrix.runtime }}/*-0.2.2-update-unsigned.zip
            projector-agent/packages/${{ matrix.runtime }}/bootstrap.json
            projector-agent/packages/${{ matrix.runtime }}/package-manifest.json

  macos-package:
    needs: policy-and-updater
    timeout-minutes: 25
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: arm64
            runner: macos-15
            runtime: osx-arm64
          - architecture: x86_64
            runner: macos-15-intel
            runtime: osx-x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build development DMG and update package
        run: sh projector-agent/scripts/build-macos.sh '${{ matrix.architecture }}' '0.2.2' development
      - name: Verify packaged seed and launcher without native UI or login registration
        run: python3 projector-agent/scripts/test-macos-package.py 'projector-agent/packages/${{ matrix.runtime }}/.build-development.noindex/bootstrap/Lecturer Projector.app'
      - name: Verify native private panel typing and content sizes without screen access
        timeout-minutes: 3
        run: |
          'projector-agent/packages/${{ matrix.runtime }}/.build-development.noindex/host/Lecturer Projector Host.app/Contents/MacOS/ProjectorMac' --remote-self-test '${{ runner.temp }}/remote-ui.json'
          python3 -c 'import json; r=json.load(open("${{ runner.temp }}/remote-ui.json")); assert r["success"]; print(json.dumps(r))'
      - name: Verify visible connection form and installed application handoff
        timeout-minutes: 3
        run: |
          'projector-agent/packages/${{ matrix.runtime }}/.build-development.noindex/host/Lecturer Projector Host.app/Contents/MacOS/ProjectorMac' --connection-self-test '${{ runner.temp }}/connection-ui.json'
          'projector-agent/packages/${{ matrix.runtime }}/.build-development.noindex/disk/Install Lecturer Projector.app/Contents/MacOS/ProjectorBootstrap' --handoff-self-test '${{ runner.temp }}/bootstrap-handoff.json'
          python3 -c 'import json; reports=[json.load(open("${{ runner.temp }}/"+name)) for name in ["connection-ui.json","bootstrap-handoff.json"]]; assert all(r["success"] for r in reports); print(json.dumps(reports))'
      - name: Verify installer payload without installing on the runner
        timeout-minutes: 3
        run: |
          'projector-agent/packages/${{ matrix.runtime }}/.build-development.noindex/disk/Install Lecturer Projector.app/Contents/MacOS/ProjectorBootstrap' --installer-self-test 'projector-agent/packages/${{ matrix.runtime }}/.build-development.noindex/disk/Install Lecturer Projector.app' '${{ runner.temp }}/installer-payload.json' 'projector-agent/packages/${{ matrix.runtime }}/.build-development.noindex/bootstrap/Lecturer Projector.app'
          python3 -c 'import json; r=json.load(open("${{ runner.temp }}/installer-payload.json")); assert r["success"]; print(json.dumps(r))'
      - uses: actions/upload-artifact@v4
        with:
          name: projector-${{ matrix.runtime }}-development
          retention-days: 1
          if-no-files-found: error
          path: |
            projector-agent/packages/${{ matrix.runtime }}/*-0.2.2-development.dmg
            projector-agent/packages/${{ matrix.runtime }}/*-0.2.2-development-update.zip
            projector-agent/packages/${{ matrix.runtime }}/*-0.2.2-development.json
            ${{ runner.temp }}/remote-ui.json
            ${{ runner.temp }}/connection-ui.json
            ${{ runner.temp }}/bootstrap-handoff.json
            ${{ runner.temp }}/installer-payload.json

# Development artifacts stay distinct from OS-signed/notarized public installers.
# Production publication requires the release procedure and physical display qualification.
