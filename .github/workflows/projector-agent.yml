name: Projector helper packages

on:
  workflow_dispatch:
  push:
    branches: ["feature/**", "fix/**"]
    paths:
      - "projector-agent/**"
      - ".github/workflows/projector-agent.yml"
  pull_request:
    paths:
      - "projector-agent/**"
      - "core/src/main/java/ru/university/assistant/projection/**"
      - "openapi/lecturer-assistant-v2.yaml"
      - ".github/workflows/projector-agent.yml"

permissions:
  contents: read

concurrency:
  group: projector-packages-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_GENERATE_ASPNET_CERTIFICATE: false

jobs:
  policy-and-updater:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet run --project projector-agent/tests/Projector.Checks/Projector.Checks.csproj -c Release
      - run: dotnet build projector-agent/src/Projector.Updater/Projector.Updater.csproj -c Release
      - run: dotnet build projector-agent/src/Projector.Launcher/Projector.Launcher.csproj -c Release
      - run: dotnet run --project projector-agent/src/Projector.Agent/Projector.Agent.csproj -- --self-test
      - run: node --check projector-agent/scripts/provision-release-key.mjs

  windows-package:
    needs: policy-and-updater
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: win-x64
            platform: WINDOWS_X64
            runner: windows-2022
          - runtime: win-arm64
            platform: WINDOWS_ARM64
            runner: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Locate or install Inno Setup compiler
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe"
          if (-not (Test-Path $compiler)) {
            winget install --id JRSoftware.InnoSetup --exact --silent --accept-package-agreements --accept-source-agreements
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed on isolated CI runner' }
          }
          if (-not (Test-Path $compiler)) { throw 'ISCC compiler is unavailable' }
          "PROJECTOR_ISCC=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build per-user development installer and update package
        shell: pwsh
        run: ./projector-agent/scripts/build-windows.ps1 -Runtime '${{ matrix.runtime }}' -Version '0.1.0' -InnoCompiler "$env:PROJECTOR_ISCC"
      - name: Build a second version for installer upgrade tests
        shell: pwsh
        run: ./projector-agent/scripts/build-windows.ps1 -Runtime '${{ matrix.runtime }}' -Version '0.1.1' -InnoCompiler "$env:PROJECTOR_ISCC"
      - name: Verify real install, upgrade, downgrade refusal and removal without launching the helper
        shell: pwsh
        run: |
          ./projector-agent/scripts/test-windows-install.ps1 -Installer 'projector-agent/packages/${{ matrix.runtime }}/lecturer-projector-${{ matrix.runtime }}-0.1.0-setup-unsigned.exe' -Platform '${{ matrix.platform }}' -UpgradeInstaller 'projector-agent/packages/${{ matrix.runtime }}/lecturer-projector-${{ matrix.runtime }}-0.1.1-setup-unsigned.exe' -UpgradeVersion '0.1.1'
      - uses: actions/upload-artifact@v4
        with:
          name: projector-${{ matrix.runtime }}-development
          retention-days: 1
          if-no-files-found: error
          path: |
            projector-agent/packages/${{ matrix.runtime }}/*-0.1.1-setup-unsigned.exe
            projector-agent/packages/${{ matrix.runtime }}/*-0.1.1-update-unsigned.zip
            projector-agent/packages/${{ matrix.runtime }}/bootstrap.json
            projector-agent/packages/${{ matrix.runtime }}/package-manifest.json

  macos-package:
    needs: policy-and-updater
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: arm64
            runner: macos-15
            runtime: osx-arm64
          - architecture: x86_64
            runner: macos-15-intel
            runtime: osx-x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build development DMG and update package
        run: sh projector-agent/scripts/build-macos.sh '${{ matrix.architecture }}' '0.1.1' development
      - name: Verify packaged seed and launcher without native UI or login registration
        run: python3 projector-agent/scripts/test-macos-package.py 'projector-agent/packages/${{ matrix.runtime }}/build-development/disk/Lecturer Projector.app'
      - uses: actions/upload-artifact@v4
        with:
          name: projector-${{ matrix.runtime }}-development
          retention-days: 1
          if-no-files-found: error
          path: |
            projector-agent/packages/${{ matrix.runtime }}/*-0.1.1-development.dmg
            projector-agent/packages/${{ matrix.runtime }}/*-0.1.1-development-update.zip
            projector-agent/packages/${{ matrix.runtime }}/*-0.1.1-development.json

# Development artifacts stay distinct from OS-signed/notarized public installers.
# Production publication requires the release procedure and physical display qualification.
