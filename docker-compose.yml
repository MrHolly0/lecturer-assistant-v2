services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lecturer_assistant}
      POSTGRES_USER: ${POSTGRES_USER:-lecturer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lecturer_dev_password}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  core:
    build:
      context: .
      dockerfile: core/Dockerfile
    environment:
      DB_URL: ${DB_URL:-jdbc:postgresql://postgres:5432/lecturer_assistant}
      DB_USERNAME: ${DB_USERNAME:-lecturer}
      DB_PASSWORD: ${DB_PASSWORD:-lecturer_dev_password}
      SERVER_PORT: 8080
    ports:
      - "${CORE_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      - core

volumes:
  postgres-data:

