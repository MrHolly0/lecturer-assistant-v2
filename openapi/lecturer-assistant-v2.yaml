openapi: 3.0.3
info:
  title: Lecturer Assistant v2 API
  version: 0.1.0
  description: Contract-first API for lecturer-assistant-v2.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /system/info:
    get:
      operationId: getSystemInfo
      summary: Read service status.
      tags: [system]
      security: []
      responses:
        "200":
          description: Service status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemInfo"
  /auth/bootstrap-admin:
    post:
      operationId: bootstrapAdmin
      summary: Create the first admin while the installation has no users.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "200":
          description: Authenticated admin.
          headers:
            Set-Cookie:
              description: httpOnly refresh token cookie scoped to /api/v1/auth.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "409":
          description: Installation already has users.
  /auth/register:
    post:
      operationId: registerByInvitation
      summary: Register by invitation code.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/RegisterRequest"
                - type: object
                  required: [invitationCode]
                  properties:
                    invitationCode:
                      type: string
                      minLength: 4
      responses:
        "200":
          description: Registered person and access token.
          headers:
            Set-Cookie:
              description: httpOnly refresh token cookie scoped to /api/v1/auth.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Invalid invitation.
  /auth/login:
    post:
      operationId: login
      summary: Login by email and password.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated person and access token.
          headers:
            Set-Cookie:
              description: httpOnly refresh token cookie scoped to /api/v1/auth.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials.
  /auth/max:
    post:
      operationId: loginWithMax
      summary: Login by signed initData of the MAX mini app.
      description: >
        Verifies the initData signature (HMAC-SHA256, key derived from the bot token) and auth_date freshness,
        finds or creates the person by MAX user id and returns a JWT.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaxAuthRequest"
      responses:
        "200":
          description: Access token and role of the person.
          headers:
            Set-Cookie:
              description: httpOnly refresh token cookie scoped to /api/v1/auth.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaxAuthResponse"
        "400":
          description: initData is blank or longer than 8192 characters, or linkCode is invalid/expired.
        "401":
          description: Signature mismatch, malformed or expired initData.
        "403":
          description: Person is disabled.
        "409":
          description: linkCode was already used.
        "429":
          description: Too many requests from this client (B-13 rate limit).
        "503":
          description: MAX login is not configured on the server (no bot token).
  /auth/refresh:
    post:
      operationId: refresh
      summary: Rotate refresh token from httpOnly cookie.
      tags: [auth]
      security: []
      responses:
        "200":
          description: Refreshed tokens.
          headers:
            Set-Cookie:
              description: Rotated httpOnly refresh token cookie scoped to /api/v1/auth.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid refresh token.
  /auth/logout:
    post:
      operationId: logout
      summary: Revoke current refresh token.
      tags: [auth]
      responses:
        "204":
          description: Logged out.
  /auth/change-password:
    post:
      operationId: changePassword
      summary: Change current user password.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Password changed.
  /auth/me:
    get:
      operationId: getCurrentUser
      summary: Read current user profile.
      tags: [auth]
      responses:
        "200":
          description: Current user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
  /admin/users:
    get:
      operationId: listUsers
      summary: List users.
      tags: [admin]
      responses:
        "200":
          description: Users.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserProfile"
  /admin/users/{personId}/role:
    put:
      operationId: updateUserRole
      summary: Change a user global role.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/PersonId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRoleRequest"
      responses:
        "200":
          description: Updated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
  /admin/users/{personId}/status:
    put:
      operationId: updateUserStatus
      summary: Activate or disable a user.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/PersonId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserStatusRequest"
      responses:
        "200":
          description: Updated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
  /admin/invitations:
    post:
      operationId: createAdminInvitation
      summary: Create an admin or lecturer invitation.
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvitationRequest"
      responses:
        "201":
          description: Created invitation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invitation"
  /identity/max/link-codes:
    post:
      operationId: createMaxLinkCode
      summary: Create a one-time code to link the caller's MAX account to their own person.
      description: >
        Requires a browser JWT of a LECTURER. The code is 6 characters from A-Z0-9, valid for 5 minutes,
        single-use. Pass it as linkCode in the next POST /auth/max from the same person's MAX account
        to attach that MAX account to this person instead of creating a new student (B-03).
      tags: [identity]
      responses:
        "201":
          description: Link code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityLinkCode"
        "403":
          description: Caller is not a lecturer.
  /identity/link-codes:
    post:
      operationId: createIdentityLinkCode
      summary: Create a short code for linking a channel identity.
      tags: [identity]
      responses:
        "201":
          description: Link code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityLinkCode"
  /identity/link:
    post:
      operationId: linkIdentity
      summary: Link channel identity by code.
      tags: [identity]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkIdentityRequest"
      responses:
        "200":
          description: Linked channel identity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelIdentity"
  /me/active-session:
    get:
      operationId: getMyActiveSession
      summary: Read the caller's own currently running (LIVE or PAUSED) lecture, if any.
      description: >
        Used by the MAX mini app to drop a lecturer straight into their running lecture instead of
        a course picker (B-03). Scoped strictly to sessions this person started themselves.
      tags: [live]
      responses:
        "200":
          description: An active session exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActiveSessionSummary"
        "204":
          description: No running session belongs to this person.
  /courses:
    get:
      operationId: listCourses
      summary: List courses visible to current user.
      tags: [courses]
      responses:
        "200":
          description: Courses.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Course"
    post:
      operationId: createCourse
      summary: Create a course.
      tags: [courses]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCourseRequest"
      responses:
        "201":
          description: Created course.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"
  /courses/{courseId}:
    get:
      operationId: getCourse
      summary: Read one course.
      tags: [courses]
      parameters:
        - $ref: "#/components/parameters/CourseId"
      responses:
        "200":
          description: Course.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseDetails"
        "403":
          description: Course is not visible to current user.
    delete:
      operationId: archiveCourse
      summary: Archive a course.
      tags: [courses]
      parameters:
        - $ref: "#/components/parameters/CourseId"
      responses:
        "204":
          description: Course archived.
  /courses/{courseId}/restore:
    post:
      operationId: restoreCourse
      summary: Restore an archived course.
      tags: [courses]
      parameters:
        - $ref: "#/components/parameters/CourseId"
      responses:
        "204":
          description: Course restored.
  /courses/{courseId}/hard:
    delete:
      operationId: hardDeleteCourse
      summary: Permanently delete an archived course.
      tags: [courses]
      parameters:
        - $ref: "#/components/parameters/CourseId"
      responses:
        "204":
          description: Course permanently deleted.
  /courses/{courseId}/invitations:
    post:
      operationId: createCourseInvitation
      summary: Create an invitation for a course or group.
      tags: [courses]
      parameters:
        - $ref: "#/components/parameters/CourseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCourseInvitationRequest"
      responses:
        "201":
          description: Created invitation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invitation"
  /courses/{courseId}/members:
    get:
      operationId: listCourseMembers
      summary: List course members.
      tags: [courses]
      parameters:
        - $ref: "#/components/parameters/CourseId"
      responses:
        "200":
          description: Members.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CourseMember"
  /courses/{courseId}/members/{personId}:
    delete:
      operationId: removeCourseMember
      summary: Remove a member from the course.
      tags: [courses]
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - name: personId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Member removed.
  /courses/{courseId}/members/{personId}/role:
    put:
      operationId: changeCourseMemberRole
      summary: Change a member's role in the course.
      tags: [courses]
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - name: personId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeMemberRoleRequest"
      responses:
        "204":
          description: Role changed.
  /courses/{courseId}/owner:
    put:
      operationId: changeCourseOwner
      summary: Transfer course ownership to another member.
      tags: [courses]
      parameters:
        - $ref: "#/components/parameters/CourseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeCourseOwnerRequest"
      responses:
        "204":
          description: Ownership transferred.
  /courses/{courseId}/groups:
    get:
      operationId: listStudyGroups
      summary: List study groups.
      tags: [courses]
      parameters:
        - $ref: "#/components/parameters/CourseId"
      responses:
        "200":
          description: Study groups.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StudyGroup"
    post:
      operationId: createStudyGroup
      summary: Create a study group.
      tags: [courses]
      parameters:
        - $ref: "#/components/parameters/CourseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStudyGroupRequest"
      responses:
        "201":
          description: Created group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudyGroup"
  /courses/{courseId}/groups/{groupId}:
    delete:
      operationId: deleteStudyGroup
      summary: Delete a study group.
      tags: [courses]
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/GroupId"
      responses:
        "204":
          description: Group deleted.
  /courses/{courseId}/bans:
    get:
      operationId: listCourseBans
      summary: List course bans.
      tags: [courses]
      parameters:
        - $ref: "#/components/parameters/CourseId"
      responses:
        "200":
          description: Course bans.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CourseBan"
    post:
      operationId: banCourseMember
      summary: Ban a person from a course.
      tags: [courses]
      parameters:
        - $ref: "#/components/parameters/CourseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BanCourseMemberRequest"
      responses:
        "201":
          description: Created ban.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseBan"
  /courses/{courseId}/decks:
    get:
      operationId: listSlideDecks
      summary: List slide decks for a course.
      tags: [content]
      parameters:
        - $ref: "#/components/parameters/CourseId"
      responses:
        "200":
          description: Slide decks.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SlideDeck"
    post:
      operationId: importSlideDeck
      summary: Upload a presentation file and start a background import job.
      tags: [content]
      parameters:
        - $ref: "#/components/parameters/CourseId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                title:
                  type: string
                  minLength: 2
      responses:
        "202":
          description: Import job accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportJob"
  /courses/{courseId}/import-jobs/{jobId}:
    get:
      operationId: getImportJob
      summary: Read slide deck import job status.
      tags: [content]
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Import job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportJob"
  /courses/{courseId}/decks/{deckId}:
    get:
      operationId: getSlideDeck
      summary: Read one slide deck with slides.
      tags: [content]
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/DeckId"
      responses:
        "200":
          description: Slide deck details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SlideDeckDetails"
    delete:
      operationId: archiveSlideDeck
      summary: Archive a slide deck.
      tags: [content]
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/DeckId"
      responses:
        "204":
          description: Deck archived.
  /courses/{courseId}/decks/{deckId}/restore:
    post:
      operationId: restoreSlideDeck
      summary: Restore an archived slide deck.
      tags: [content]
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/DeckId"
      responses:
        "204":
          description: Deck restored.
  /courses/{courseId}/decks/{deckId}/hard:
    delete:
      operationId: hardDeleteSlideDeck
      summary: Permanently delete an archived slide deck.
      tags: [content]
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/DeckId"
      responses:
        "204":
          description: Deck permanently deleted.
  /courses/{courseId}/decks/{deckId}/slides/{slideIndex}/image:
    get:
      operationId: getSlideImage
      summary: Read rendered slide image.
      tags: [content]
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/DeckId"
        - $ref: "#/components/parameters/SlideIndex"
        - name: t
          in: query
          required: false
          description: Short-lived HMAC token scoped to the course and deck.
          schema:
            type: string
      responses:
        "200":
          description: Slide image.
          headers:
            Cache-Control:
              description: Long-lived immutable cache header.
              schema:
                type: string
          content:
            image/png:
              schema:
                type: string
                format: binary
  /courses/{courseId}/decks/{deckId}/slides/{slideIndex}/notes:
    put:
      operationId: saveSlideNote
      summary: Save lecturer notes for one slide.
      tags: [content]
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/DeckId"
        - $ref: "#/components/parameters/SlideIndex"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveSlideNoteRequest"
      responses:
        "200":
          description: Saved note.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SlideNote"
    delete:
      operationId: deleteSlideNote
      summary: Clear lecturer notes for one slide.
      tags: [content]
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/DeckId"
        - $ref: "#/components/parameters/SlideIndex"
      responses:
        "204":
          description: Note cleared.
  /courses/{courseId}/lectures:
    get:
      operationId: listLectures
      summary: List lecture materials for a course.
      tags: [content]
      parameters:
        - $ref: "#/components/parameters/CourseId"
      responses:
        "200":
          description: Lectures.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Lecture"
    post:
      operationId: createLecture
      summary: Create lecture material.
      tags: [content]
      parameters:
        - $ref: "#/components/parameters/CourseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLectureRequest"
      responses:
        "201":
          description: Created lecture.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lecture"
  /courses/{courseId}/lectures/{lectureId}:
    get:
      operationId: getLecture
      summary: Read lecture material.
      tags: [content]
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/LectureId"
      responses:
        "200":
          description: Lecture material.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LectureDetails"
    put:
      operationId: updateLecture
      summary: Update lecture material.
      tags: [content]
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/LectureId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLectureRequest"
      responses:
        "200":
          description: Updated lecture.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lecture"
    delete:
      operationId: deleteLecture
      summary: Archive lecture material.
      tags: [content]
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/LectureId"
      responses:
        "204":
          description: Lecture archived.
  /courses/{courseId}/lectures/{lectureId}/restore:
    post:
      operationId: restoreLecture
      summary: Restore archived lecture material.
      tags: [content]
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/LectureId"
      responses:
        "204":
          description: Lecture restored.
  /courses/{courseId}/lectures/{lectureId}/hard:
    delete:
      operationId: hardDeleteLecture
      summary: Permanently delete archived lecture material.
      tags: [content]
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/LectureId"
      responses:
        "204":
          description: Lecture permanently deleted.
  /courses/{courseId}/lectures/{lectureId}/attachments:
    post:
      operationId: uploadLectureAttachment
      summary: Upload an arbitrary file attached to a lecture.
      tags: [content]
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/LectureId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Uploaded attachment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attachment"
  /courses/{courseId}/lectures/{lectureId}/attachments/{attachmentId}:
    delete:
      operationId: deleteLectureAttachment
      summary: Delete an attachment from a lecture.
      tags: [content]
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/LectureId"
        - $ref: "#/components/parameters/AttachmentId"
      responses:
        "204":
          description: Attachment deleted.
  /courses/{courseId}/lectures/{lectureId}/sessions:
    post:
      operationId: startLiveSession
      summary: Start a live session for a lecture.
      tags: [live]
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/LectureId"
      responses:
        "201":
          description: Started session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveSession"
  /courses/{courseId}/sessions:
    get:
      operationId: listCompletedSessions
      summary: List completed lecture sessions for a course.
      description: Returns only ENDED and ARCHIVED sessions, newest completion first.
      tags: [live]
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Page of completed sessions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionHistoryPage"
        "400":
          description: Invalid limit or offset.
        "403":
          description: The caller cannot manage this course.
  /courses/{courseId}/sessions/{sessionId}:
    get:
      operationId: getLiveSession
      summary: Read current live session state.
      tags: [live]
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Session state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveSession"
  /courses/{courseId}/sessions/{sessionId}/participants:
    get:
      operationId: listSessionParticipants
      summary: List participants connected to a live session.
      tags: [live]
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Session participants.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SessionParticipant"
  /courses/{courseId}/sessions/join:
    post:
      operationId: joinLiveSession
      summary: Join a live session by join code.
      tags: [live]
      parameters:
        - $ref: "#/components/parameters/CourseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinSessionRequest"
      responses:
        "200":
          description: Joined session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveSession"
  /courses/{courseId}/sessions/{sessionId}/slide:
    put:
      operationId: changeLiveSessionSlide
      summary: Change current slide.
      tags: [live]
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeSlideRequest"
      responses:
        "200":
          description: Updated session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveSession"
  /courses/{courseId}/sessions/{sessionId}/annotations:
    put:
      operationId: saveLiveSessionAnnotations
      summary: Save live annotations.
      tags: [live]
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveAnnotationsRequest"
      responses:
        "200":
          description: Updated session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveSession"
  /courses/{courseId}/sessions/{sessionId}/pause:
    post:
      operationId: pauseLiveSession
      summary: Pause live session.
      tags: [live]
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Paused session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveSession"
  /courses/{courseId}/sessions/{sessionId}/resume:
    post:
      operationId: resumeLiveSession
      summary: Resume live session.
      tags: [live]
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Resumed session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveSession"
  /courses/{courseId}/sessions/{sessionId}/end:
    post:
      operationId: endLiveSession
      summary: End live session.
      tags: [live]
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Ended session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveSession"
  /courses/{courseId}/sessions/{sessionId}/engagement:
    get:
      operationId: getLiveSessionEngagement
      summary: Read live student signals and questions for presenter.
      tags: [live]
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Student engagement snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentEngagement"
  /courses/{courseId}/sessions/{sessionId}/summary:
    get:
      operationId: getLectureSummary
      summary: Read the completed lecture summary for a lecturer.
      description: Available to course managers after the session is ENDED or ARCHIVED.
      tags: [live]
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Participants, problem slides, all poll results, and unanswered questions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LectureSummary"
        "403":
          description: The caller cannot manage this course.
        "404":
          description: Session not found in this course.
        "409":
          description: Session has not ended yet.
  /student/sessions/{joinCode}:
    get:
      operationId: getStudentSession
      summary: Read student session snapshot by join code.
      description: >
        Personal fields (myVote) are filled when the request is identified by a Bearer JWT or by the
        X-Participant-Token header. Without identification the shared snapshot is returned.
      tags: [student]
      security: []
      parameters:
        - $ref: "#/components/parameters/JoinCode"
        - name: X-Participant-Token
          in: header
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Student session snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentSessionSnapshot"
  /student/sessions/{joinCode}/join:
    post:
      operationId: joinStudentSession
      summary: Join a live session as a web student.
      tags: [student]
      security: []
      parameters:
        - $ref: "#/components/parameters/JoinCode"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentJoinRequest"
      responses:
        "200":
          description: Joined web session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentJoinResponse"
  /student/sessions/{joinCode}/events:
    get:
      operationId: streamStudentSession
      summary: SSE stream with current student session state.
      tags: [student]
      security: []
      parameters:
        - $ref: "#/components/parameters/JoinCode"
        - $ref: "#/components/parameters/ParticipantTokenQuery"
      responses:
        "200":
          description: Server-sent student session events.
          content:
            text/event-stream:
              schema:
                type: string
  /student/sessions/{joinCode}/signals:
    post:
      operationId: submitStudentSignal
      summary: Submit current comprehension signal.
      tags: [student]
      security: []
      parameters:
        - $ref: "#/components/parameters/JoinCode"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentSignalRequest"
      responses:
        "200":
          description: Updated aggregate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignalAggregate"
        "429":
          description: Too many requests from this client (B-13 rate limit).
  /student/sessions/{joinCode}/questions:
    post:
      operationId: askStudentQuestion
      summary: Ask a question from web student channel.
      tags: [student]
      security: []
      parameters:
        - $ref: "#/components/parameters/JoinCode"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentQuestionRequest"
      responses:
        "201":
          description: Created question.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentQuestion"
  /courses/{courseId}/sessions/{sessionId}/polls:
    get:
      operationId: listClosedPolls
      summary: List closed quick polls for a session.
      description: Returns closed polls newest first, including answer distribution and correct option.
      tags: [interaction]
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/SessionId"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Page of closed polls with results.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClosedPollPage"
        "400":
          description: Invalid limit or offset.
        "403":
          description: The caller cannot manage this course.
        "404":
          description: Session does not belong to this course.
    post:
      operationId: startPoll
      summary: Start a quick poll for the current session.
      tags: [interaction]
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartPollRequest"
      responses:
        "201":
          description: Started poll with initial vote counts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PollResult"
        "409":
          description: A poll is already open for this session.
        "404":
          description: Session does not belong to this course.
  /courses/{courseId}/sessions/{sessionId}/polls/active:
    get:
      operationId: getActivePoll
      summary: Get the currently open poll with live vote counts.
      tags: [interaction]
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Active poll with vote counts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PollResult"
        "404":
          description: No active poll.
  /courses/{courseId}/sessions/{sessionId}/polls/from-bank:
    post:
      operationId: startPollFromBank
      summary: Start a quick poll from an existing course question.
      description: >
        Copies the question text and options into the live poll. The source question must be an active
        CHOICE or TRUE_FALSE question with 2-6 options and exactly one correct option. The saved correct
        option is revealed to students only after the poll closes.
      tags: [interaction]
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartBankPollRequest"
      responses:
        "201":
          description: Started poll.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PollResult"
        "404":
          description: Session or question not found in this course.
        "409":
          description: A poll is already open for this session.
        "422":
          description: The question type or option set cannot be used as a quick poll.
  /courses/{courseId}/sessions/{sessionId}/polls/{pollId}:
    get:
      operationId: getPollResult
      summary: Get poll result by id.
      tags: [interaction]
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/PollId"
      responses:
        "200":
          description: Poll result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PollResult"
        "404":
          description: Poll not found, or it does not belong to this session.
  /courses/{courseId}/sessions/{sessionId}/polls/{pollId}/close:
    post:
      operationId: closePoll
      summary: Close an open poll and optionally reveal the correct answer.
      tags: [interaction]
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/PollId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClosePollRequest"
      responses:
        "200":
          description: Closed poll with final vote counts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PollResult"
        "404":
          description: Poll not found, or it does not belong to this session.
        "409":
          description: Poll already closed.
  /student/sessions/{joinCode}/polls/{pollId}/respond:
    post:
      operationId: respondToPoll
      summary: Submit the student answer to a poll (the first answer wins).
      tags: [student]
      security: []
      parameters:
        - $ref: "#/components/parameters/JoinCode"
        - $ref: "#/components/parameters/PollId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PollResponseRequest"
      responses:
        "200":
          description: >
            accepted=false when the student already answered or the poll is closed; myVote is the fixed choice.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PollVote"
        "404":
          description: Poll does not belong to this session.
  /courses/{courseId}/questions:
    post:
      operationId: createQuestion
      summary: Create a question in the bank.
      tags: [interaction]
      parameters:
        - $ref: "#/components/parameters/CourseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateQuestionRequest"
      responses:
        "201":
          description: Created question.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionBankEntry"
    get:
      operationId: listQuestions
      summary: List questions in the bank, optionally filtered by tag.
      tags: [interaction]
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - name: tag
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Questions list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QuestionBankEntry"
  /courses/{courseId}/questions/{questionId}:
    get:
      operationId: getQuestion
      summary: Get a question by id.
      tags: [interaction]
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/QuestionId"
      responses:
        "200":
          description: Question.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionBankEntry"
        "404":
          description: Question not found, or it does not belong to this course.
    put:
      operationId: updateQuestion
      summary: Update question text, options, or tags.
      tags: [interaction]
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/QuestionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateQuestionRequest"
      responses:
        "200":
          description: Updated question.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionBankEntry"
        "404":
          description: Question not found, or it does not belong to this course.
    delete:
      operationId: archiveQuestion
      summary: Archive (soft-delete) a question.
      tags: [interaction]
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/QuestionId"
      responses:
        "204":
          description: Archived.
        "404":
          description: Question not found, or it does not belong to this course.
  /courses/{courseId}/activities:
    post:
      operationId: createActivity
      summary: Create an activity definition.
      tags: [interaction]
      parameters:
        - $ref: "#/components/parameters/CourseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateActivityRequest"
      responses:
        "201":
          description: Created activity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityDefinition"
    get:
      operationId: listActivities
      summary: List activity definitions for a course.
      tags: [interaction]
      parameters:
        - $ref: "#/components/parameters/CourseId"
      responses:
        "200":
          description: Activity definitions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityDefinition"
  /courses/{courseId}/activities/{definitionId}:
    get:
      operationId: getActivity
      summary: Get an activity definition.
      tags: [interaction]
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/DefinitionId"
      responses:
        "200":
          description: Activity definition.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityDefinition"
        "404":
          description: Activity definition not found, or it does not belong to this course.
  /courses/{courseId}/sessions/{sessionId}/activities/{definitionId}/runs:
    post:
      operationId: startActivityRun
      summary: Start an activity run for the current session.
      tags: [interaction]
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/DefinitionId"
      responses:
        "201":
          description: Started run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityRun"
        "404":
          description: Session or activity definition does not belong to this course.
  /courses/{courseId}/sessions/{sessionId}/activity-runs/{runId}/close:
    post:
      operationId: closeActivityRun
      summary: Close an open activity run.
      tags: [interaction]
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Closed run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityRun"
        "404":
          description: Run not found, or it does not belong to this session.
  /courses/{courseId}/sessions/{sessionId}/activity-runs/{runId}/responses:
    get:
      operationId: getActivityResponses
      summary: Get all responses for a run.
      tags: [interaction]
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Responses.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityResponse"
        "404":
          description: Run not found, or it does not belong to this session.
  /student/sessions/{joinCode}/activity-runs/{runId}/respond:
    post:
      operationId: respondToActivity
      summary: Submit or update a student response to an activity question.
      tags: [student]
      security: []
      parameters:
        - $ref: "#/components/parameters/JoinCode"
        - $ref: "#/components/parameters/RunId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitActivityResponseRequest"
      responses:
        "201":
          description: Response recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityResponse"
        "409":
          description: Activity run already closed.
  /config/channels:
    get:
      operationId: getChannelJoinConfig
      summary: Read configured channel connection targets.
      description: Null values mean that the corresponding channel is not configured.
      tags: [channel]
      responses:
        "200":
          description: Telegram and VK connection targets used by the web client.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelJoinConfig"
  /internal/v1/channels/{channelType}/capabilities:
    servers:
      - url: /
    put:
      operationId: registerChannelCapabilities
      summary: Register adapter capabilities.
      tags: [channel-internal]
      parameters:
        - $ref: "#/components/parameters/ChannelType"
      security:
        - internalApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChannelCapabilities"
      responses:
        "204":
          description: Capabilities stored.
  /internal/v1/channels/{channelType}/outbox:
    servers:
      - url: /
    get:
      operationId: pollChannelOutbox
      summary: Long-poll outbound messages for an adapter.
      tags: [channel-internal]
      parameters:
        - $ref: "#/components/parameters/ChannelType"
        - name: wait
          in: query
          schema:
            type: string
            default: 25s
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
      security:
        - internalApiKey: []
      responses:
        "200":
          description: Batch of messages claimed by the adapter.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutboxBatch"
  /internal/v1/channels/{channelType}/delivery-reports:
    servers:
      - url: /
    post:
      operationId: reportChannelDelivery
      summary: Report adapter delivery results.
      tags: [channel-internal]
      parameters:
        - $ref: "#/components/parameters/ChannelType"
      security:
        - internalApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliveryReportBatch"
      responses:
        "204":
          description: Reports accepted.
  /internal/v1/channels/{channelType}/inbound:
    servers:
      - url: /
    post:
      operationId: submitChannelInbound
      summary: Submit a normalized inbound event.
      tags: [channel-internal]
      parameters:
        - $ref: "#/components/parameters/ChannelType"
      security:
        - internalApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InboundEvent"
      responses:
        "202":
          description: Inbound event accepted.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    internalApiKey:
      type: apiKey
      in: header
      name: X-Internal-Api-Key
  parameters:
    CourseId:
      name: courseId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DeckId:
      name: deckId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GroupId:
      name: groupId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LectureId:
      name: lectureId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AttachmentId:
      name: attachmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PersonId:
      name: personId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SlideIndex:
      name: slideIndex
      in: path
      required: true
      schema:
        type: integer
        minimum: 0
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    JoinCode:
      name: joinCode
      in: path
      required: true
      schema:
        type: string
        minLength: 4
    PollId:
      name: pollId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    QuestionId:
      name: questionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DefinitionId:
      name: definitionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ParticipantTokenQuery:
      name: participantToken
      in: query
      required: true
      schema:
        type: string
        minLength: 16
    ChannelType:
      name: channelType
      in: path
      required: true
      schema:
        type: string
        enum: [telegram, vk, web, echo]
  schemas:
    ActiveSessionSummary:
      type: object
      required: [sessionId, courseId, joinCode, lectureTitle, currentSlideIdx]
      properties:
        sessionId:
          type: string
          format: uuid
        courseId:
          type: string
          format: uuid
        joinCode:
          type: string
        lectureTitle:
          type: string
        currentSlideIdx:
          type: integer
    SystemInfo:
      type: object
      required: [name, version, status]
      properties:
        name:
          type: string
          example: lecturer-assistant-v2
        version:
          type: string
          example: 0.0.1-SNAPSHOT
        status:
          type: string
          enum: [BOOTSTRAPPED]
    RegisterRequest:
      type: object
      required: [displayName, email, password]
      properties:
        displayName:
          type: string
          minLength: 2
        email:
