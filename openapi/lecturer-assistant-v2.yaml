        sessionId:
          type: string
          format: uuid
        lectureId:
          type: string
          format: uuid
        lectureTitle:
          type: string
        status:
          $ref: "#/components/schemas/SessionStatus"
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
        durationSeconds:
          type: integer
          format: int64
          minimum: 0
        participantCount:
          type: integer
          minimum: 0
        participants:
          type: array
          items:
            $ref: "#/components/schemas/SessionParticipant"
        signalTotals:
          $ref: "#/components/schemas/SignalAggregate"
        problemSlides:
          type: array
          description: Slides with at least one RED signal, ordered by RED count descending.
          items:
            $ref: "#/components/schemas/SummaryProblemSlide"
        pollResults:
          type: array
          items:
            $ref: "#/components/schemas/SummaryPollResult"
        questionsCount:
          type: integer
          minimum: 0
        unansweredQuestionCount:
          type: integer
          minimum: 0
        unansweredQuestions:
          type: array
          items:
            $ref: "#/components/schemas/StudentQuestion"
    SummaryProblemSlide:
      type: object
      required: [slideIdx, green, yellow, red, total]
      properties:
        slideIdx:
          type: integer
          minimum: 1
        green:
          type: integer
          minimum: 0
        yellow:
          type: integer
          minimum: 0
        red:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 1
    SummaryPollResult:
      type: object
      required:
        - pollId
        - questionText
        - options
        - status
        - votes
        - totalResponses
        - startedAt
      properties:
        pollId:
          type: string
          format: uuid
        sourceQuestionId:
          type: string
          format: uuid
          nullable: true
        questionText:
          type: string
        options:
          type: array
          items:
            type: string
        status:
          $ref: "#/components/schemas/PollStatus"
        votes:
          type: array
          items:
            type: integer
            minimum: 0
        totalResponses:
          type: integer
          minimum: 0
        correctOptionIdx:
          type: integer
          nullable: true
          minimum: 0
        startedAt:
          type: string
          format: date-time
        closedAt:
          type: string
          format: date-time
          nullable: true
    ChannelJoinConfig:
      type: object
      required: [telegramBot, vkBot]
      properties:
        telegramBot:
          type: string
          nullable: true
        vkBot:
          type: string
          nullable: true
    ChannelCapabilities:
      type: object
      required: [inlineButtons, editMessage, images, maxTextLength, maxButtonsPerRow]
      properties:
        inlineButtons:
          type: boolean
        editMessage:
          type: boolean
        images:
          type: boolean
        maxTextLength:
          type: integer
          minimum: 1
        maxButtonsPerRow:
          type: integer
          minimum: 1
    OutboundPriority:
      type: string
      enum: [P0_INTERACTIVE, P1_ACTIVITY, P2_SLIDE, P3_BULK]
    ReplyMode:
      type: string
      enum: [NEW, EDIT_LAST]
    OutboundContent:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [TEXT, IMAGE, DOCUMENT]
        text:
          type: string
        ref:
          type: string
        caption:
          type: string
    OutboundButton:
      type: object
      required: [text, payload]
      properties:
        text:
          type: string
        payload:
          type: string
    OutboundMessage:
      type: object
      required: [id, channelIdentityId, externalUserId, priority, content, keyboard, replyMode, threadKey]
      properties:
        id:
          type: string
          format: uuid
        channelIdentityId:
          type: string
          format: uuid
        externalUserId:
          type: string
        priority:
          $ref: "#/components/schemas/OutboundPriority"
        content:
          $ref: "#/components/schemas/OutboundContent"
        keyboard:
          type: array
          items:
            type: array
            items:
              $ref: "#/components/schemas/OutboundButton"
        replyMode:
          $ref: "#/components/schemas/ReplyMode"
        threadKey:
          type: string
    OutboxBatch:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/OutboundMessage"
    DeliveryStatus:
      type: string
      enum: [DELIVERED, FAILED]
    DeliveryReport:
      type: object
      required: [messageId, status]
      properties:
        messageId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/DeliveryStatus"
        adapterMessageId:
          type: string
        errorMessage:
          type: string
        latencyMs:
          type: integer
          minimum: 0
    DeliveryReportBatch:
      type: object
      required: [reports]
      properties:
        reports:
          type: array
          items:
            $ref: "#/components/schemas/DeliveryReport"
    InboundKind:
      type: string
      enum: [COMMAND, TEXT, CALLBACK]
    InboundEvent:
      type: object
      required: [externalUserId, kind, text, occurredAt]
      properties:
        externalUserId:
          type: string
        kind:
          $ref: "#/components/schemas/InboundKind"
        text:
          type: string
        displayHint:
          type: string
        occurredAt:
          type: string
          format: date-time
